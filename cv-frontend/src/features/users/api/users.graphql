query Users($params: SearchPaginationInput) {
  users(params: $params) {
    items {
      id
      email
      profile {
        id
        first_name
        last_name
        avatar
      }
      department {
        id
        name
      }
      position {
        id
        name
      }
    }
    total
    page
    limit
    total_pages
  }
}
